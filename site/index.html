<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f7f8f6" />
    <meta name="description" content="Foco & Jornada — produtividade pessoal e profissional." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <script>
      ;(() => {
        const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? false
        let preference = 'system'

        try {
          const persisted = JSON.parse(localStorage.getItem('foco-jornada-ui-v2') || '{}')
          const storedTheme = persisted?.state?.theme
          if (storedTheme === 'light' || storedTheme === 'dark' || storedTheme === 'system') {
            preference = storedTheme
          }
        } catch {
          // Um valor local inválido não deve impedir o arranque da aplicação.
        }

        const resolved = preference === 'system' ? (prefersDark ? 'dark' : 'light') : preference
        const themeColor = resolved === 'dark' ? '#070a08' : '#f7f8f6'
        document.documentElement.dataset.theme = resolved
        document.documentElement.style.colorScheme = resolved
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', themeColor)
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          ?.setAttribute('content', resolved === 'dark' ? 'black-translucent' : 'default')
      })()
    </script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #f7f8f6;
      }

      [data-theme='dark'] body {
        background: #070a08;
      }

      .appBootFallback {
        min-height: 100dvh;
        box-sizing: border-box;
        display: grid;
        place-items: center;
        padding: 32px 24px;
        background: #f7f8f6;
        color: #17201b;
        font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        text-align: center;
      }

      [data-theme='dark'] .appBootFallback {
        background: #070a08;
        color: #f4f6f5;
      }

      .appBootFallbackInner {
        display: grid;
        gap: 10px;
        justify-items: center;
        max-width: 320px;
      }

      .appBootFallback strong {
        font-size: 1.1rem;
      }

      .appBootFallback p {
        margin: 0;
        color: #66706a;
        line-height: 1.5;
      }

      [data-theme='dark'] .appBootFallback p {
        color: #aeb8b2;
      }

      .appBootFallback a {
        display: none;
        margin-top: 8px;
        padding: 11px 16px;
        border-radius: 999px;
        background: #2f8f5b;
        color: #fff;
        font-weight: 750;
        text-decoration: none;
      }

      .appBootFallback[data-stalled='true'] a {
        display: inline-flex;
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/Foco-Jornada/icon.svg" />
    <title>Foco & Jornada</title>
    <script type="module" crossorigin src="/Foco-Jornada/assets/index-CbkLkBlB.js"></script>
    <link rel="stylesheet" crossorigin href="/Foco-Jornada/assets/index-Vd3G5PC7.css">
  <link rel="manifest" href="/Foco-Jornada/manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="/Foco-Jornada/registerSW.js"></script></head>
  <body>
    <div id="root">
      <div class="appBootFallback" id="app-boot-fallback" role="status" aria-live="polite">
        <div class="appBootFallbackInner">
          <strong>Foco Jornada</strong>
          <p id="app-boot-message">A carregar a aplicação…</p>
          <a href="/Foco-Jornada/" id="app-boot-retry">Reabrir aplicação</a>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(() => {
        const fallback = document.getElementById('app-boot-fallback')
        const message = document.getElementById('app-boot-message')
        if (!fallback || !message) return
        fallback.dataset.stalled = 'true'
        message.textContent = 'A aplicação não iniciou. Tenta reabrir pela ligação principal.'
      }, 8000)
    </script>
  </body>
</html>
