<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Foco Jornada</title>
    <script>
      ;(() => {
        const base = '/Foco-Jornada/'
        const pathname = window.location.pathname

        if (!pathname.startsWith('/Foco-Jornada')) {
          window.location.replace(base)
          return
        }

        const route = pathname
          .slice('/Foco-Jornada'.length)
          .replace(/^\/+|\/+$/g, '')
        const nextHash = window.location.hash || (route ? `#/${route}` : '#/')
        window.location.replace(`${base}${window.location.search}${nextHash}`)
      })()
    </script>
  </head>
  <body>
    <p>A reabrir Foco Jornada…</p>
  </body>
</html>
