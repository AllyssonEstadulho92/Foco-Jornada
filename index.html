<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1018" />
    <meta name="description" content="Foco & Jornada — produtividade pessoal e profissional." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <title>Foco & Jornada</title>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-width: 320px;
        min-height: 100%;
        background: #0b1018;
        color: #f3f6fb;
      }

      .bootFallback {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        text-align: center;
      }

      .bootFallback > div {
        max-width: 420px;
      }

      .bootFallback strong {
        display: block;
        margin-bottom: 8px;
        font-size: 18px;
      }

      .bootFallback span {
        color: #94a3b8;
        font-size: 14px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="bootFallback" role="status">
        <div>
          <strong>Foco & Jornada</strong>
          <span>A carregar a aplicação…</span>
        </div>
      </div>
    </div>
    <script>
      window.setTimeout(function () {
        var fallback = document.querySelector('.bootFallback span')
        if (fallback) fallback.textContent = 'A aplicação demorou mais do que o esperado. Atualiza a página daqui a alguns segundos.'
      }, 8000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
