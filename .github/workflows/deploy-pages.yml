name: Publicar Foco & Jornada

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicar-foco-jornada
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v5

      - name: Configurar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Gerar aplicação
        run: npm run build

      - name: Validar build
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/registerSW.js
          test -f dist/sw.js
          test -f dist/.nojekyll

      - name: Publicar build na raiz da branch
        run: |
          rm -rf assets site
          rm -f index.html manifest.webmanifest registerSW.js sw.js 404.html notification-sw.js redirect.js report-qr.svg logo-mark.svg .nojekyll
          rm -f workbox-*.js
          cp -a dist/. .
          rm -rf dist
          rm -f package-lock.json tsconfig.app.tsbuildinfo

      - name: Guardar publicação
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git add -f .nojekyll index.html manifest.webmanifest registerSW.js sw.js
          git add -f assets/
          git add -f 404.html icon.svg logo-mark.svg notification-sw.js redirect.js report-qr.svg
          if [ -d site ]; then git add -f site/; fi
          for file in workbox-*.js; do
            if [ -f "$file" ]; then git add -f "$file"; fi
          done

          if git diff --cached --quiet; then
            echo "Sem alterações de publicação."
            exit 0
          fi

          git commit -m "deploy: atualizar GitHub Pages [skip ci]"
          git push
