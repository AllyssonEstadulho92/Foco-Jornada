name: Qualidade

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Verificar tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Verificar artefacto do Pages
        run: |
          test -f dist/index.html
          grep -q '/Foco-Jornada/assets/' dist/index.html
          if grep -q '/src/main.tsx' dist/index.html; then
            echo 'ERRO: o index de produção ainda referencia o código-fonte.'
            exit 1
          fi
      - name: Diagnosticar configuração atual do GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/pages"
