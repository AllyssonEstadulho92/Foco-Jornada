name: Qualidade

on:
  push:
    branches: [main, audit-hardening-1-2-final]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar dependências
        run: npm install
      - name: Verificar tipos
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke test de arranque no browser
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Nenhum browser Chromium disponível no runner."
            exit 1
          fi

          mkdir -p .smoke/Foco-Jornada
          cp -R dist/. .smoke/Foco-Jornada/
          python3 -m http.server 4173 --directory .smoke >/tmp/foco-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2

          smoke() {
            local label="$1"
            local size="$2"
            local output="/tmp/foco-dom-${label}.html"
            local log="/tmp/foco-chrome-${label}.log"

            "$CHROME_BIN"               --headless               --no-sandbox               --disable-gpu               --window-size="$size"               --virtual-time-budget=12000               --dump-dom               http://127.0.0.1:4173/Foco-Jornada/               >"$output" 2>"$log" || true

            echo "--- browser stderr (${label}) ---"
            cat "$log" || true
            echo "--- fim browser stderr (${label}) ---"

            if grep -q 'id="app-boot-fallback"' "$output"; then
              echo "ERRO: a aplicação não substituiu o fallback de arranque (${label})."
              grep -n -E 'app-boot-fallback|A aplicação não iniciou|A carregar a aplicação' "$output" || true
              exit 1
            fi
            if ! grep -q 'id="root"' "$output"; then
              echo "ERRO: o documento final não contém #root (${label})."
              exit 1
            fi
          }

          smoke desktop 1440,1000
          smoke mobile 390,844

          MOBILE_DOM=/tmp/foco-dom-mobile.html
          grep -q 'aria-label="Navegação móvel"' "$MOBILE_DOM"
          grep -q '>Início<' "$MOBILE_DOM"
          grep -q '>Foco<' "$MOBILE_DOM"
          grep -q '>Relatórios<' "$MOBILE_DOM"
          grep -q '>Perfil<' "$MOBILE_DOM"
      - name: Guardar build como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: site-build
          path: dist
          if-no-files-found: error
