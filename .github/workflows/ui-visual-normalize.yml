name: Migração visual auditada

on:
  push:
    branches:
      - fix/visual-consistency-audit

permissions:
  contents: write

jobs:
  migrate-visuals:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v5
        with:
          ref: fix/visual-consistency-audit

      - name: Aplicar migração
        run: python scripts/visual_migrate.py

      - name: Validar diff
        run: git diff --check

      - name: Registar migração
        run: |
          if git diff --quiet; then
            echo 'Sem alterações adicionais.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src index.html
          git commit -m 'style: unificar iconografia e famílias tipográficas'
          git push origin HEAD:fix/visual-consistency-audit
