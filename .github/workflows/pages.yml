name: Publicar Foco & Jornada
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    name: Publicar aplicação
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Executar testes
        run: npm run check
      - name: Preparar site
        run: |
          mkdir -p _site
          cp index.html styles.css ux.css features.css hub.css couple.css core.js app.js stability.js ux.js features-core.js features.js hub.js controls.js couple-core.js couple.js manifest.webmanifest sw.js icon.svg .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
