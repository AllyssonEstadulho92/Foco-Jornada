name: Publicar Foco & Jornada
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    name: Publicar aplicação
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Executar testes
        run: npm run check
      - name: Preparar site
        run: |
          mkdir -p _site
          cp index.html styles.css ux.css features.css hub.css hub-about.css settings-controller.css shift-planner.css shift-mobile.css shift-compact.css runtime-fixes.css interaction-fixes.css professional.css productivity.css install-app.css stability-ui.css linear-ui.css bootstrap.js boot-recovery.js core.js productivity-core.js planning-mode.js persistence.js install-app.js app.js stability.js ux.js features-core.js features.js hub.js hub-help.js hub-about.js controls.js settings-controller.js shift-planner-core.js shift-planner.js shift-advanced-core.js shift-advanced.js shift-reports.js shift-mobile-interactions.js app-links.js interaction-fixes.js runtime-fixes.js summary-guard.js professional-core.js professional-ui.js couple.js manifest.webmanifest sw.js icon.svg apple-touch-icon.png icon-192.png icon-512.png .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
