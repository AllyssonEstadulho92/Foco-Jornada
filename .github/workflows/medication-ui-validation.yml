name: Validação funcional da Medicação

on:
  pull_request:
    paths:
      - 'src/presentation/pages/MedicationsStockPage.tsx'
      - 'src/presentation/components/MedicationPrototypeWorkspace.tsx'
      - 'src/styles/medication-refinement.css'
      - 'src/styles/medication-refinement.test.ts'
      - 'src/main.tsx'
      - '.github/workflows/medication-ui-validation.yml'

permissions:
  contents: read

jobs:
  medication-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fixar npm compatível
        run: npm install -g npm@11.6.0 --no-audit --no-fund
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Verificar TypeScript
        run: npm run typecheck
      - name: Verificar lint
        run: npm run lint
      - name: Executar testes
        run: npm test
      - name: Compilar aplicação
        run: npm run build
      - name: Validar Worker sem publicar
        run: npm run worker:check
      - name: Smoke test de arranque no Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME_BIN" ]; then
            echo "Nenhum browser Chromium disponível no runner."
            exit 1
          fi
          mkdir -p .smoke/Foco-Jornada
          cp -R dist/. .smoke/Foco-Jornada/
          python3 -m http.server 4173 --directory .smoke >/tmp/foco-med-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --virtual-time-budget=12000 \
            --dump-dom http://127.0.0.1:4173/Foco-Jornada/ \
            >/tmp/foco-med-dom.html 2>/tmp/foco-med-chrome.log || true
          if grep -q 'id="app-boot-fallback"' /tmp/foco-med-dom.html; then
            echo "ERRO: aplicação não substituiu fallback de arranque."
            exit 1
          fi
          if ! grep -q 'id="root"' /tmp/foco-med-dom.html; then
            echo "ERRO: documento final sem #root."
            exit 1
          fi
      - name: Verificar existência da aplicação no build
        shell: bash
        run: |
          test -s dist/index.html
          test -d dist/assets
